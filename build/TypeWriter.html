<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Editor</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Lora:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --dark: #141413;
    --light: #faf9f5;
    --mid-gray: #b0aea5;
    --light-gray: #e8e6dc;
    --orange: #d97757;
    --blue: #6a9bcc;
    --green: #788c5d;

    /* Warm mode colors - 15% darker with better contrast */
    --warm-bg: #dfd4c5;
    --warm-text: #2d2218;
    --warm-border: #bfb09d;
    --warm-hover: #d0c4b3;
    --warm-mid-gray: #8a7f70;

    /* Soft dark mode - optimized for astigmatism */
    --soft-dark-bg: #2b2826;
    --soft-dark-text: #d4c9bb;
    --soft-dark-border: #4a4540;
    --soft-dark-hover: #3a3632;
    --soft-dark-mid-gray: #8a7f70;
}

body {
    font-family: 'Lora', Georgia, serif;
    background-color: var(--light);
    color: var(--dark);
    transition: background-color 0.3s, color 0.3s;
}

body.dark-mode {
    background-color: var(--dark);
    color: var(--light);
}

body.warm-mode {
    background-color: var(--warm-bg);
    color: var(--warm-text);
}

body.soft-dark-mode {
    background-color: var(--soft-dark-bg);
    color: var(--soft-dark-text);
}

.header {
    padding: 20px 40px;
    border-bottom: 1px solid var(--light-gray);
    display: flex;
    justify-content: space-between;
    align-items: center;
}

body.dark-mode .header {
    border-bottom-color: rgba(176, 174, 165, 0.2);
}

body.warm-mode .header {
    border-bottom-color: var(--warm-border);
}

body.soft-dark-mode .header {
    border-bottom-color: var(--soft-dark-border);
}

.header h1 {
    font-family: 'Poppins', Arial, sans-serif;
    font-size: 20px;
    font-weight: 500;
    color: var(--orange);
}

.controls {
    display: flex;
    gap: 15px;
    align-items: center;
}

button {
    font-family: 'Poppins', Arial, sans-serif;
    padding: 8px 16px;
    border: 1px solid var(--light-gray);
    background: transparent;
    color: var(--dark);
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    transition: all 0.2s;
}

body.dark-mode button {
    border-color: rgba(176, 174, 165, 0.3);
    color: var(--light);
}

body.warm-mode button {
    border-color: var(--warm-border);
    color: var(--warm-text);
}

body.soft-dark-mode button {
    border-color: var(--soft-dark-border);
    color: var(--soft-dark-text);
}

button:hover {
    background: var(--light-gray);
    border-color: var(--mid-gray);
}

body.dark-mode button:hover {
    background: rgba(176, 174, 165, 0.1);
    border-color: var(--mid-gray);
}

body.warm-mode button:hover {
    background: var(--warm-hover);
    border-color: var(--mid-gray);
}

body.soft-dark-mode button:hover {
    background: var(--soft-dark-hover);
    border-color: var(--soft-dark-mid-gray);
}

button.primary {
    background: var(--orange);
    color: var(--light);
    border-color: var(--orange);
}

button.primary:hover {
    background: #c26645;
    border-color: #c26645;
}

.theme-toggle {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    padding: 0;
}

.theme-toggle svg {
    width: 20px;
    height: 20px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
}

.editor-container {
    max-width: 900px;
    margin: 0 auto;
    padding: 40px 40px 80px;
    min-height: calc(100vh - 81px);
}

textarea {
    width: 100%;
    min-height: calc(100vh - 200px);
    border: none;
    outline: none;
    font-family: 'Lora', Georgia, serif;
    font-size: 16px;
    line-height: 1.8;
    resize: none;
    background: transparent;
    color: var(--dark);
}

body.dark-mode textarea {
    color: var(--light);
}

body.warm-mode textarea {
    color: var(--warm-text);
}

body.soft-dark-mode textarea {
    color: var(--soft-dark-text);
}

textarea::placeholder {
    color: var(--mid-gray);
}

body.warm-mode textarea::placeholder {
    color: var(--warm-mid-gray);
}

body.soft-dark-mode textarea::placeholder {
    color: var(--soft-dark-mid-gray);
}

.word-count {
    position: fixed;
    bottom: 20px;
    right: 40px;
    font-family: 'Poppins', Arial, sans-serif;
    font-size: 13px;
    color: var(--mid-gray);
    background: var(--light);
    padding: 8px 12px;
    border-radius: 6px;
    border: 1px solid var(--light-gray);
}

body.dark-mode .word-count {
    background: var(--dark);
    border-color: rgba(176, 174, 165, 0.2);
}

body.warm-mode .word-count {
    background: var(--warm-bg);
    border-color: var(--warm-border);
    color: var(--warm-mid-gray);
}

body.soft-dark-mode .word-count {
    background: var(--soft-dark-bg);
    border-color: var(--soft-dark-border);
    color: var(--soft-dark-mid-gray);
}

.toast {
    position: fixed;
    top: 100px;
    right: 40px;
    background: var(--green);
    color: var(--light);
    padding: 12px 20px;
    border-radius: 6px;
    font-family: 'Poppins', Arial, sans-serif;
    font-size: 14px;
    opacity: 0;
    transform: translateY(-20px);
    transition: all 0.3s;
    pointer-events: none;
}

.toast.show {
    opacity: 1;
    transform: translateY(0);
}

/* Font size controls */
.font-size-control {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'Poppins', Arial, sans-serif;
    font-size: 13px;
    color: var(--mid-gray);
}

.font-size-control button {
    padding: 4px 10px;
    font-size: 13px;
}

body.warm-mode .font-size-control {
    color: var(--warm-mid-gray);
}

body.soft-dark-mode .font-size-control {
    color: var(--soft-dark-mid-gray);
}

.hidden {
    display: none;
}

.view-content {
    font-family: 'Lora', Georgia, serif;
    line-height: 1.8;
    font-size: 16px;
}

.view-content h1 {
    font-family: 'Poppins', Arial, sans-serif;
    font-size: 32px;
    font-weight: 600;
    margin: 24px 0 16px 0;
    color: var(--orange);
}

.view-content h2 {
    font-family: 'Poppins', Arial, sans-serif;
    font-size: 24px;
    font-weight: 600;
    margin: 20px 0 12px 0;
}

.view-content h3 {
    font-family: 'Poppins', Arial, sans-serif;
    font-size: 18px;
    font-weight: 600;
    margin: 16px 0 8px 0;
}

.view-content p {
    margin: 12px 0;
}

.view-content code {
    background: var(--light-gray);
    padding: 2px 6px;
    border-radius: 3px;
    font-family: 'Courier New', monospace;
    font-size: 14px;
}

body.dark-mode .view-content code {
    background: rgba(176, 174, 165, 0.15);
}

body.warm-mode .view-content code {
    background: var(--warm-hover);
}

body.soft-dark-mode .view-content code {
    background: var(--soft-dark-hover);
}

.view-content blockquote {
    border-left: 4px solid var(--orange);
    padding-left: 16px;
    margin: 16px 0;
    color: var(--mid-gray);
    font-style: italic;
}

body.dark-mode .view-content blockquote {
    color: rgba(176, 174, 165, 0.8);
}

body.warm-mode .view-content blockquote {
    color: var(--warm-mid-gray);
}

body.soft-dark-mode .view-content blockquote {
    color: var(--soft-dark-mid-gray);
}

.view-content ul {
    margin: 12px 0;
    padding-left: 24px;
}

.view-content li {
    margin: 6px 0;
}

.view-content a {
    color: var(--blue);
    text-decoration: none;
    border-bottom: 1px solid var(--blue);
}

.view-content a:hover {
    opacity: 0.8;
}

.view-content strong {
    font-weight: 600;
}

.view-content em {
    font-style: italic;
}
</style>
</head>

<body>
    <div class="header">
        <h1>Text Editor</h1>
        <div class="controls">
            <div class="font-size-control">
                <button onclick="changeFontSize(-1)" title="Decrease font size">A-</button>
                <span id="font-size-display">16px</span>
                <button onclick="changeFontSize(1)" title="Increase font size">A+</button>
            </div>
            <button onclick="openFile()">Open file</button>
            <button onclick="clearText()">Clear</button>
            <button class="primary" onclick="saveFile()">Save as .txt</button>
            <button class="theme-toggle" onclick="cycleTheme()" title="Change theme" id="theme-toggle">
                <!-- Sun icon (light mode) -->
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z" />
                </svg>
            </button>
            <input type="file" id="file-input" accept=".txt" class="hidden" onchange="handleFileSelect(event)">
        </div>
    </div>

    <div class="editor-container">
        <textarea id="editor" placeholder="Start writing..." spellcheck="true" autofocus></textarea>
    </div>

    <div class="word-count" id="word-count">0 words</div>
    <div class="toast" id="toast">File saved!</div>

    <script>
const editor = document.getElementById('editor');
const wordCount = document.getElementById('word-count');
const toast = document.getElementById('toast');
const themeToggle = document.getElementById('theme-toggle');
const fontSizeDisplay = document.getElementById('font-size-display');
const fileInput = document.getElementById('file-input');

let currentFontSize = 16;
let currentFileName = '';
let currentTheme = 'light';
let isViewMode = false;

const themeIcons = {
    light: `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z" />
    </svg>`,
    warm: `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15.362 5.214A8.252 8.252 0 0 1 12 21 8.25 8.25 0 0 1 6.038 7.047 8.287 8.287 0 0 0 9 9.601a8.983 8.983 0 0 1 3.361-6.867 8.21 8.21 0 0 0 3 2.48Z" />
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 18a3.75 3.75 0 0 0 .495-7.468 5.99 5.99 0 0 0-1.925 3.547 5.975 5.975 0 0 1-2.133-1.001A3.75 3.75 0 0 0 12 18Z" />
    </svg>`,
    'soft-dark': `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z" />
    </svg>`,
    dark: `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z" />
    </svg>`
};

const themeLabels = {
    light: 'Light mode',
    warm: 'Warm mode',
    'soft-dark': 'Soft dark mode',
    dark: 'Dark mode'
};

function markdownToHtml(markdown) {
    let html = markdown;

    html = html.replace(/^\### (.*?)$/gm, '<h3>$1</h3>');
    html = html.replace(/^\## (.*?)$/gm, '<h2>$1</h2>');
    html = html.replace(/^# (.*?)$/gm, '<h1>$1</h1>');

    html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
    html = html.replace(/__(.*?)__/g, '<strong>$1</strong>');
    html = html.replace(/\*(.*?)\*/g, '<em>$1</em>');
    html = html.replace(/_(.*?)_/g, '<em>$1</em>');

    html = html.replace(/`(.*?)`/g, '<code>$1</code>');

    html = html.replace(/\[(.*?)\]\((.*?)\)/g, '<a href="$2">$1</a>');

    html = html.replace(/^\> (.*?)$/gm, '<blockquote>$1</blockquote>');

    const lines = html.split('\n');
    let inList = false;
    let listHtml = '';
    let result = [];

    for (let line of lines) {
        if (/^[\-\*\+] /.test(line)) {
            if (!inList) {
                inList = true;
                listHtml = '<ul>\n';
            }
            listHtml += '<li>' + line.replace(/^[\-\*\+] /, '') + '</li>\n';
        } else {
            if (inList) {
                listHtml += '</ul>';
                result.push(listHtml);
                listHtml = '';
                inList = false;
            }
            if (line.trim()) {
                if (!line.startsWith('<')) result.push('<p>' + line + '</p>');
                else result.push(line);
            }
        }
    }
    if (inList) {
        listHtml += '</ul>';
        result.push(listHtml);
    }

    return result.join('\n');
}

function toggleViewMode() {
    isViewMode = !isViewMode;
    const container = document.querySelector('.editor-container');

    if (isViewMode) {
        const rendered = markdownToHtml(editor.value);
        const viewDiv = document.createElement('div');
        viewDiv.id = 'view-mode';
        viewDiv.className = 'view-content';
        viewDiv.innerHTML = rendered;

        editor.style.display = 'none';
        container.appendChild(viewDiv);
        toast.textContent = 'View mode';
    } else {
        const viewDiv = document.getElementById('view-mode');
        if (viewDiv) viewDiv.remove();
        editor.style.display = 'block';
        toast.textContent = 'Edit mode';
    }

    toast.classList.add('show');
    setTimeout(() => {
        toast.classList.remove('show');
    }, 1500);
}

window.addEventListener('load', () => {
    const savedText = localStorage.getItem('editorText');
    const savedTheme = localStorage.getItem('theme') || 'light';
    const savedFontSize = localStorage.getItem('fontSize');

    if (savedText) {
        editor.value = savedText;
        updateWordCount();
    }

    applyTheme(savedTheme);

    if (savedFontSize) {
        currentFontSize = parseInt(savedFontSize);
        editor.style.fontSize = currentFontSize + 'px';
        fontSizeDisplay.textContent = currentFontSize + 'px';
    }
});

editor.addEventListener('input', () => {
    localStorage.setItem('editorText', editor.value);
    updateWordCount();
});

function updateWordCount() {
    const text = editor.value.trim();
    const words = text ? text.split(/\s+/).length : 0;
    const chars = editor.value.length;
    wordCount.textContent = `${words} words · ${chars} characters`;
}

function applyTheme(theme) {
    document.body.classList.remove('dark-mode', 'warm-mode', 'soft-dark-mode');

    currentTheme = theme;
    if (theme === 'dark') {
        document.body.classList.add('dark-mode');
    } else if (theme === 'warm') {
        document.body.classList.add('warm-mode');
    } else if (theme === 'soft-dark') {
        document.body.classList.add('soft-dark-mode');
    }

    themeToggle.innerHTML = themeIcons[theme];
    themeToggle.title = themeLabels[theme];

    localStorage.setItem('theme', theme);
}

function cycleTheme() {
    const themes = ['light', 'warm', 'soft-dark', 'dark'];
    const currentIndex = themes.indexOf(currentTheme);
    const nextTheme = themes[(currentIndex + 1) % themes.length];
    applyTheme(nextTheme);
}

function changeFontSize(delta) {
    currentFontSize = Math.max(12, Math.min(24, currentFontSize + delta));
    editor.style.fontSize = currentFontSize + 'px';
    fontSizeDisplay.textContent = currentFontSize + 'px';
    localStorage.setItem('fontSize', currentFontSize);
}

function clearText() {
    if (editor.value.trim() === '' || confirm('Are you sure you want to clear all text?')) {
        editor.value = '';
        localStorage.removeItem('editorText');
        currentFileName = '';
        updateWordCount();
    }
}

function openFile() {
    fileInput.click();
}

function handleFileSelect(event) {
    const file = event.target.files[0];
    if (!file) return;

    currentFileName = file.name;

    const reader = new FileReader();
    reader.onload = (e) => {
        editor.value = e.target.result;
        localStorage.setItem('editorText', editor.value);
        updateWordCount();

        toast.textContent = `Opened: ${file.name}`;
        toast.classList.add('show');
        setTimeout(() => {
            toast.classList.remove('show');
            toast.textContent = 'File saved!';
        }, 2000);
    };
    reader.readAsText(file);

    fileInput.value = '';
}

function saveFile() {
    const text = editor.value;
    const blob = new Blob([text], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;

    if (currentFileName) {
        a.download = currentFileName;
    } else {
        const date = new Date();
        const dateStr = date.toISOString().split('T')[0];
        a.download = `note-${dateStr}.md`;
    }

    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);

    toast.classList.add('show');
    setTimeout(() => {
        toast.classList.remove('show');
    }, 2000);
}

document.addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key === 's') {
        e.preventDefault();
        saveFile();
    }

    if ((e.metaKey || e.ctrlKey) && e.key === 'd') {
        e.preventDefault();
        cycleTheme();
    }

    if ((e.metaKey || e.ctrlKey) && e.key === 'r') {
        e.preventDefault();
        toggleViewMode();
    }
});

updateWordCount();

</script>
</body>

</html>
