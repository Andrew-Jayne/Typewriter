<div class="toolbar collapsed" id="toolbar">
    <div class="toolbar-trigger" id="toolbar-open">
        {{icon:icons/hamburger.svg}}
    </div>
    <div class="toolbar-items">
        <button type="button" class="icon-btn" id="btn-open" data-tooltip="Open file">
            {{icon:icons/open-file.svg}}
        </button>
        <button type="button" class="icon-btn" id="btn-clear" data-tooltip="Clear">
            {{icon:icons/clear.svg}}
        </button>
        <button type="button" class="icon-btn" id="btn-save" data-tooltip="Save">
            {{icon:icons/save.svg}}
        </button>
        <button
            type="button"
            class="mode-toggle"
            data-tooltip="Switch to reader"
            id="mode-toggle"
        >
            <span id="icon-edit-mode">{{icon:icons/edit-mode.svg}}</span>
            <span id="icon-view-mode" class="hidden"
                >{{icon:icons/view-mode.svg}}</span
            >
        </button>
        <div class="theme-picker" id="theme-picker">
            <button
                type="button"
                class="theme-toggle"
                data-tooltip="Select theme"
                id="theme-toggle"
            >
                {{icon:icons/daylight.svg}}
            </button>
            <div class="theme-picker-menu" id="theme-picker-menu">
                <button
                    type="button"
                    class="theme-option"
                    data-theme="dawn"
                >
                    <span class="theme-option-icon"
                        >{{icon:icons/dawn.svg}}</span
                    >
                    <span>Dawn</span>
                </button>
                <button
                    type="button"
                    class="theme-option"
                    data-theme="daylight"
                >
                    <span class="theme-option-icon"
                        >{{icon:icons/daylight.svg}}</span
                    >
                    <span>Daylight</span>
                </button>
                <button
                    type="button"
                    class="theme-option"
                    data-theme="dusk"
                >
                    <span class="theme-option-icon"
                        >{{icon:icons/dusk.svg}}</span
                    >
                    <span>Dusk</span>
                </button>
                <button
                    type="button"
                    class="theme-option"
                    data-theme="darkness"
                >
                    <span class="theme-option-icon"
                        >{{icon:icons/darkness.svg}}</span
                    >
                    <span>Darkness</span>
                </button>
                <button
                    type="button"
                    class="theme-option"
                    data-theme="diy"
                >
                    <span class="theme-option-icon"
                        >{{icon:icons/diy.svg}}</span
                    >
                    <span>DIY</span>
                </button>
            </div>
        </div>
        <button
            type="button"
            class="settings-toggle"
            id="btn-settings"
            data-tooltip="Settings"
        >
            {{icon:icons/settings.svg}}
        </button>
        <button
            type="button"
            class="icon-btn"
            id="btn-fullscreen"
            data-tooltip="Fullscreen"
        >
            <span id="icon-fullscreen-enter"
                >{{icon:icons/fullscreen-enter.svg}}</span
            >
            <span id="icon-fullscreen-exit" class="hidden"
                >{{icon:icons/fullscreen-exit.svg}}</span
            >
        </button>
        <button
            type="button"
            class="icon-btn"
            id="toolbar-close"
            data-tooltip="Close menu"
        >
            {{icon:icons/close-menu.svg}}
        </button>
    </div>
    <input
        type="file"
        id="file-input"
        accept=".txt"
        class="hidden"
    />
</div>
