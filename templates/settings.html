<div
    class="settings-overlay"
    id="settings-modal"
>
    <div class="settings-modal">
        <h2>Settings</h2>

        <div class="settings-section">
            <h3>Editor</h3>
            <div class="settings-row">
                <span>Font size</span>
                <div class="font-size-setting">
                    <input
                        type="number"
                        id="setting-font-size"
                        min="8"
                        max="128"
                        value="16"
                    />
                    <span class="font-size-unit">px</span>
                </div>
            </div>
            <label class="toggle-row">
                <span>Line numbers</span>
                <input
                    type="checkbox"
                    id="toggle-line-numbers"
                    data-state-key="showLineNumbers"
                />
                <span class="toggle-switch"></span>
            </label>
            <label class="toggle-row">
                <span>Monospace font</span>
                <input
                    type="checkbox"
                    id="toggle-monospace"
                    data-state-key="useMonospace"
                />
                <span class="toggle-switch"></span>
            </label>
            <label class="toggle-row">
                <span>Wide mode</span>
                <input
                    type="checkbox"
                    id="toggle-wide"
                    data-state-key="enableWideMode"
                />
                <span class="toggle-switch"></span>
            </label>
            <label class="toggle-row">
                <span>Tooltips</span>
                <input
                    type="checkbox"
                    id="toggle-tooltips"
                    data-state-key="showTooltips"
                />
                <span class="toggle-switch"></span>
            </label>
            <label class="toggle-row">
                <span>Word count</span>
                <input
                    type="checkbox"
                    id="toggle-word-count"
                    data-state-key="showWordCount"
                />
                <span class="toggle-switch"></span>
            </label>
            <label class="toggle-row">
                <span>Focus mode</span>
                <input
                    type="checkbox"
                    id="toggle-focus-mode"
                />
                <span class="toggle-switch"></span>
            </label>
            <div class="settings-hint">
                Hides the menu. Refresh or Cmd/Ctrl+, to reopen settings.
            </div>
        </div>

        <div class="settings-section">
            <h3>Custom Colors</h3>
            <div class="settings-error" id="diy-color-error"></div>
            <div class="settings-color-row">
                <input
                    type="color"
                    class="settings-swatch"
                    id="diy-bg-picker"
                    data-field="bg"
                />
                <label>Background</label>
                <input
                    type="text"
                    class="settings-color-input"
                    id="diy-bg-hex"
                    spellcheck="false"
                    placeholder="#faf9f5"
                    data-field="bg"
                />
            </div>
            <div class="settings-color-row">
                <input
                    type="color"
                    class="settings-swatch"
                    id="diy-text-picker"
                    data-field="text"
                />
                <label>Text</label>
                <input
                    type="text"
                    class="settings-color-input"
                    id="diy-text-hex"
                    spellcheck="false"
                    placeholder="#141413"
                    data-field="text"
                />
            </div>
            <div class="settings-color-row">
                <input
                    type="color"
                    class="settings-swatch"
                    id="diy-accent-picker"
                    data-field="accent"
                />
                <label>Accent</label>
                <input
                    type="text"
                    class="settings-color-input"
                    id="diy-accent-hex"
                    spellcheck="false"
                    placeholder="#d97757"
                    data-field="accent"
                />
            </div>
            <div class="settings-color-row">
                <input
                    type="color"
                    class="settings-swatch"
                    id="diy-border-picker"
                    data-field="border"
                />
                <label>Border</label>
                <input
                    type="text"
                    class="settings-color-input"
                    id="diy-border-hex"
                    spellcheck="false"
                    placeholder="#e8e6dc"
                    data-field="border"
                />
            </div>
        </div>

        <div class="settings-modal-buttons">
            <button type="button" id="btn-close-settings">Close</button>
        </div>
    </div>
</div>
