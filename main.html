<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TypeWriter</title>
    <link rel="stylesheet" href="base.css">
    <link rel="stylesheet" href="toolbar.css">
    <link rel="stylesheet" href="editor.css">
    <link rel="stylesheet" href="settings.css">
</head>

<body>
    <div class="toolbar collapsed" id="toolbar">
        <div class="toolbar-trigger" onclick="toggleToolbar()">{{icon:icons/hamburger.svg}}</div>
        <div class="toolbar-items">
            <button class="icon-btn" onclick="openFile()" data-tooltip="Open file">{{icon:icons/open-file.svg}}</button>
            <button class="icon-btn" onclick="clearText()" data-tooltip="Clear">{{icon:icons/clear.svg}}</button>
            <button class="icon-btn" onclick="saveFile()" data-tooltip="Save">{{icon:icons/save.svg}}</button>
            <button class="mode-toggle" onclick="toggleMode()" data-tooltip="Switch to reader" id="mode-toggle">
                <span id="icon-edit-mode">{{icon:icons/edit-mode.svg}}</span>
                <span id="icon-view-mode" class="hidden">{{icon:icons/view-mode.svg}}</span>
            </button>
            <div class="theme-picker" id="theme-picker">
                <button class="theme-toggle" onclick="toggleThemePicker()" data-tooltip="Select theme"
                    id="theme-toggle">{{icon:icons/daylight.svg}}</button>
                <div class="theme-picker-menu" id="theme-picker-menu">
                    <button class="theme-option" onclick="selectTheme('dawn')">
                        <span class="theme-option-icon" id="icon-dawn"></span>
                        <span>Dawn</span>
                    </button>
                    <button class="theme-option" onclick="selectTheme('daylight')">
                        <span class="theme-option-icon" id="icon-daylight"></span>
                        <span>Daylight</span>
                    </button>
                    <button class="theme-option" onclick="selectTheme('dusk')">
                        <span class="theme-option-icon" id="icon-dusk"></span>
                        <span>Dusk</span>
                    </button>
                    <button class="theme-option" onclick="selectTheme('darkness')">
                        <span class="theme-option-icon" id="icon-darkness"></span>
                        <span>Darkness</span>
                    </button>
                    <button class="theme-option" onclick="selectTheme('diy')">
                        <span class="theme-option-icon" id="icon-diy"></span>
                        <span>DIY</span>
                    </button>
                </div>
            </div>
            <button class="settings-toggle" onclick="toggleSettings()"
                data-tooltip="Settings">{{icon:icons/settings.svg}}</button>
            <button class="icon-btn" onclick="toggleFullscreen()" data-tooltip="Fullscreen">
                <span id="icon-fullscreen-enter">{{icon:icons/fullscreen-enter.svg}}</span>
                <span id="icon-fullscreen-exit" class="hidden">{{icon:icons/fullscreen-exit.svg}}</span>
            </button>
            <button class="icon-btn" onclick="toggleToolbar()"
                data-tooltip="Close menu">{{icon:icons/close-menu.svg}}</button>
        </div>
        <input type="file" id="file-input" accept=".txt" class="hidden" onchange="handleFileSelect(event)">
    </div>

    <div class="editor-container">
        <div class="editor-wrap">
            <div class="line-numbers" id="line-numbers"></div>
            <textarea id="editor" placeholder="Start writing..." spellcheck="true"></textarea>
        </div>
    </div>

    <div class="word-count" id="word-count">0 words</div>

    <div class="settings-overlay" id="settings-modal" onclick="closeSettingsOnOverlay(event)">
        <div class="settings-modal">
            <h2>Settings</h2>

            <div class="settings-section">
                <h3>Editor</h3>
                <div class="settings-row">
                    <span>Font size</span>
                    <div class="font-size-setting">
                        <input type="number" id="setting-font-size" min="8" max="72" value="16"
                            onchange="setFontSize(this.value)">
                        <span class="font-size-unit">px</span>
                    </div>
                </div>
                <label class="toggle-row">
                    <span>Line numbers</span>
                    <input type="checkbox" id="toggle-line-numbers" onchange="toggleLineNumbers(this.checked)">
                    <span class="toggle-switch"></span>
                </label>
                <label class="toggle-row">
                    <span>Monospace font</span>
                    <input type="checkbox" id="toggle-monospace" onchange="toggleMonospace(this.checked)">
                    <span class="toggle-switch"></span>
                </label>
                <label class="toggle-row">
                    <span>Wide mode</span>
                    <input type="checkbox" id="toggle-wide" onchange="toggleWideMode(this.checked)">
                    <span class="toggle-switch"></span>
                </label>
                <label class="toggle-row">
                    <span>Tooltips</span>
                    <input type="checkbox" id="toggle-tooltips" onchange="toggleTooltips(this.checked)">
                    <span class="toggle-switch"></span>
                </label>
                <label class="toggle-row">
                    <span>Word count</span>
                    <input type="checkbox" id="toggle-word-count" onchange="toggleWordCount(this.checked)">
                    <span class="toggle-switch"></span>
                </label>
            </div>

            <div class="settings-section">
                <h3>Custom Colors</h3>
                <div class="settings-color-row">
                    <input type="color" class="settings-swatch" id="diy-bg-picker"
                        oninput="handleDiyPickerInput('bg', this.value)">
                    <label>Background</label>
                    <input type="text" class="settings-color-input" id="diy-bg-hex" spellcheck="false"
                        placeholder="#faf9f5" oninput="handleDiyColorInput('bg', this.value)">

                </div>
                <div class="settings-color-row">
                    <input type="color" class="settings-swatch" id="diy-text-picker"
                        oninput="handleDiyPickerInput('text', this.value)">
                    <label>Text</label>
                    <input type="text" class="settings-color-input" id="diy-text-hex" spellcheck="false"
                        placeholder="#141413" oninput="handleDiyColorInput('text', this.value)">

                </div>
                <div class="settings-color-row">
                    <input type="color" class="settings-swatch" id="diy-accent-picker"
                        oninput="handleDiyPickerInput('accent', this.value)">
                    <label>Accent</label>
                    <input type="text" class="settings-color-input" id="diy-accent-hex" spellcheck="false"
                        placeholder="#d97757" oninput="handleDiyColorInput('accent', this.value)">

                </div>
                <div class="settings-color-row">
                    <input type="color" class="settings-swatch" id="diy-border-picker"
                        oninput="handleDiyPickerInput('border', this.value)">
                    <label>Border</label>
                    <input type="text" class="settings-color-input" id="diy-border-hex" spellcheck="false"
                        placeholder="#e8e6dc" oninput="handleDiyColorInput('border', this.value)">

                </div>
                <div class="settings-color-row">
                    <input type="color" class="settings-swatch" id="diy-save-picker"
                        oninput="handleDiyPickerInput('save', this.value)">
                    <label>Save button</label>
                    <input type="text" class="settings-color-input" id="diy-save-hex" spellcheck="false"
                        placeholder="#d97757" oninput="handleDiyColorInput('save', this.value)">

                </div>
            </div>

            <div class="settings-modal-buttons">
                <button onclick="closeSettings()">Close</button>
            </div>
        </div>
    </div>

    <script src="marked.min.js"></script>
    <script src="state.js"></script>
    <script src="themes.js"></script>
    <script src="editor.js"></script>
    <script src="ui.js"></script>
</body>

</html>
