<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Editor</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Lora:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="TypeWriter.css">
</head>

<body>
    <div class="header">
        <h1>Text Editor</h1>
        <div class="controls">
            <div class="font-size-control">
                <button onclick="changeFontSize(-1)" title="Decrease font size">A-</button>
                <span id="font-size-display">16px</span>
                <button onclick="changeFontSize(1)" title="Increase font size">A+</button>
            </div>
            <button onclick="openFile()">Open file</button>
            <button onclick="clearText()">Clear</button>
            <button class="primary" onclick="saveFile()">Save as .txt</button>
            <button class="theme-toggle" onclick="cycleTheme()" title="Change theme" id="theme-toggle">
                <!-- Sun icon (light mode) -->
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z" />
                </svg>
            </button>
            <input type="file" id="file-input" accept=".txt" class="hidden" onchange="handleFileSelect(event)">
        </div>
    </div>

    <div class="editor-container">
        <textarea id="editor" placeholder="Start writing..." spellcheck="true" autofocus></textarea>
    </div>

    <div class="word-count" id="word-count">0 words</div>
    <div class="toast" id="toast">File saved!</div>

    <script src="TypeWriter.js"></script>
</body>

</html>
